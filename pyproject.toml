[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caxa-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for CAXA CAD (数码大方 电子图板) - AI-driven GB-standard mechanical drafting and parametric modeling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "phosugar" }
]
keywords = [
    "caxa",
    "mcp",
    "model-context-protocol",
    "cad",
    "caxa-draft",
    "mechanical-engineering",
    "dxf",
    "autocad",
    "ai-agent",
    "fastmcp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "mcp>=1.0.0",
    "ezdxf>=1.1.0",
    "pywin32>=306; platform_system=='Windows'",
    "pyautogui>=0.9.54",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/phosugar/caxa-mcp"
Repository = "https://github.com/phosugar/caxa-mcp"
Issues = "https://github.com/phosugar/caxa-mcp/issues"

[project.scripts]
caxa-mcp = "caxa_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["caxa_mcp*"]
